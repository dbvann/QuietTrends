name: Update homepage title

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-homepage-title.yml'

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update title
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = '<title>QuietTrends // AI Product Intercept</title>'
          new = '<title>QuietTrends // AI-Driven Market Research for Smarter Product Reviews</title>'
          if old not in text:
              raise SystemExit('Expected title not found; no changes made.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit change and remove one-time workflow
        run: |
          rm .github/workflows/update-homepage-title.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/update-homepage-title.yml
          git commit -m 'Update homepage title for AI-driven market research'
          git push
