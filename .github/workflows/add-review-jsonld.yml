name: Add review structured data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-review-jsonld.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: pip install beautifulsoup4

      - name: Add bylines and JSON-LD
        run: python scripts/add_review_jsonld.py

      - name: Commit migrated articles
        run: |
          if git diff --quiet; then
            echo "No article changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Add author dates and review JSON-LD [skip ci]"
          git push
