name: Publish EBO Max article links
on:
  push:
    paths:
      - '.github/workflows/publish-ebo-max.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path

          slug = 'enabot-ebo-max-familybot-product-review.html'
          card = '''                <article class="feed-card"><div class="feed-img-box"><img src="assets/images/products/placeholder-image.jpeg" alt="Enabot EBO Max FamilyBot AI home monitoring robot"></div><div class="feed-card-body"><h4>Enabot EBO Max FamilyBot</h4><p>Wait-for-more-reviews analysis of Enabot's $599 AI home robot, including mobile 4K monitoring, pet interaction, privacy, navigation reliability, and EBO X/camera alternatives.</p><a href="enabot-ebo-max-familybot-product-review.html" class="template-link-btn">Read review &rarr;</a></div></article>\n'''

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          if slug not in index:
              marker = '            <div class="research-grid">\n'
              if marker not in index:
                  raise SystemExit('research-grid marker not found in index.html')
              index = index.replace(marker, marker + card, 1)
              index_path.write_text(index, encoding='utf-8')

          sitemap_path = Path('sitemap.xml')
          sitemap = sitemap_path.read_text(encoding='utf-8')
          url = f'https://quiettrends.com/{slug}'
          if url not in sitemap:
              entry = f'  <url><loc>{url}</loc><lastmod>2026-07-31</lastmod></url>\n'
              if '</urlset>' not in sitemap:
                  raise SystemExit('urlset closing tag not found in sitemap.xml')
              sitemap = sitemap.replace('</urlset>', entry + '</urlset>', 1)
              sitemap_path.write_text(sitemap, encoding='utf-8')

          Path('.github/workflows/publish-ebo-max.yml').unlink()
          PY
      - name: Commit publication links
        run: |
          git config user.name "QuietTrends Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sitemap.xml .github/workflows/publish-ebo-max.yml
          git commit -m "Add EBO Max review to index and sitemap [skip ci]"
          git push