name: Add Amazon affiliate links batch 1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-amazon-affiliate-links-batch-1.yml'

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update five product reviews
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, urllib.parse, urllib.request

          tag = 'quiettrends-20'
          targets = [
              ('acanva-luxury-modular-sectional-sofa-set-product-review.html', 'Acanva Luxury Modular Sectional Sofa Set'),
              ('fellow-espresso-series-1-product-review.html', 'Fellow Espresso Series 1'),
              ('ninja-crispi-dualzone-glass-air-fryer-product-review.html', 'Ninja Crispi DualZone Glass Air Fryer'),
              ('current-model-g-dual-zone-electric-grill-product-review.html', 'Current Model G Dual-Zone Electric Grill'),
              ('igarden-swim-jet-x-pro-10-product-review.html', 'iGarden Swim Jet X Pro 10'),
          ]

          def find_asin(product):
              q = urllib.parse.quote_plus(product + ' site:amazon.com/dp')
              req = urllib.request.Request('https://www.google.com/search?q=' + q, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  html = urllib.request.urlopen(req, timeout=20).read().decode('utf-8', 'ignore')
              except Exception:
                  return None
              for m in re.finditer(r'https?://(?:www\.)?amazon\.com/(?:[^\"&<> ]*/)?(?:dp|gp/product)/([A-Z0-9]{10})', html):
                  return m.group(1)
              return None

          changed = []
          skipped = []
          for filename, product in targets:
              p = Path(filename)
              if not p.exists():
                  skipped.append(f'{filename}: missing')
                  continue
              asin = find_asin(product)
              if not asin:
                  skipped.append(f'{filename}: no verified ASIN')
                  continue
              affiliate = f'https://www.amazon.com/dp/{asin}?tag={tag}'
              text = p.read_text(encoding='utf-8')
              original = text
              text = re.sub(
                  r'href="https://www\.amazon\.com/s\?k=[^"]*?(?:&amp;|&)tag=quiettrends-20"',
                  f'href="{affiliate}"',
                  text,
              )
              if text == original:
                  text = re.sub(
                      r'href="https://www\.amazon\.com/(?:[^\"]*/)?(?:dp|gp/product)/[A-Z0-9]{10}(?:\?[^\"]*)?"',
                      f'href="{affiliate}"',
                      text,
                  )
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(f'{filename}: {asin}')
              else:
                  skipped.append(f'{filename}: no Amazon CTA links found')

          print('Changed:')
          print('\n'.join(changed) or 'None')
          print('Skipped:')
          print('\n'.join(skipped) or 'None')
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/add-amazon-affiliate-links-batch-1.yml
          git add -A
          git commit -m "Add Amazon affiliate links to first five product reviews" || exit 0
          git push
